
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | CampusGenius</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .auth-container {
      max-width: 460px;
      margin: 50px auto;
      padding: 28px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px #00000012;
    }
    .auth-container h1 { color: #0a7f3f; }
    .auth-container label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
    }
    .auth-container input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .auth-container button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      background: #0a7f3f;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="auth-container">
    <h1>Create your account</h1>
    <p>Join CampusGenius — Learn Today. Lead Tomorrow.</p>

    <form id="registerForm">
      <label for="fullName">Full name</label>
      <input id="fullName" name="fullName" type="text"
        required minlength="2" maxlength="120" autocomplete="name">

      <label for="email">Email address</label>
      <input id="email" name="email" type="email"
        required autocomplete="email">

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
        required minlength="8" maxlength="72"
        autocomplete="new-password">

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword"
        type="password" required autocomplete="new-password">

      <button id="registerButton" type="submit">
        Create Account
      </button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p>Already have an account?
      <a href="login.html">Log in</a>
    </p>
    <p><a href="../index.html">Back to Home</a></p>
  </main>

  <script>
    const API_URL = "https://campusgenius.onrender.com";

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      message.textContent = "";

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        message.textContent = "The passwords do not match.";
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";

      try {
        const response = await fetch(
          API_URL + "/api/auth/register",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fullName, email, password })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Registration failed.");
        }

        message.textContent =
          "Account created successfully! You can now log in.";
        form.reset();
      } catch (error) {
        message.textContent =
          error.message === "Failed to fetch"
            ? "Could not reach the server. Please try again."
            : error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
