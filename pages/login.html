
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CampusGenius</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      background: #f5f8f6;
      font-family: Arial, sans-serif;
    }
    .login-box {
      max-width: 420px;
      margin: 60px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 15px #00000012;
    }
    h1 { color: #0a7f3f; }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #0a7f3f;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="login-box">
    <h1>Welcome Back!</h1>
    <p>Log in to your CampusGenius account.</p>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" required>

      <button type="submit" id="loginButton">Log In</button>
    </form>

    <p id="message" role="status"></p>
    <p>Don't have an account? <a href="register.html">Register here</a></p>
    <p><a href="../index.html">Back to Home</a></p>
  </main>

  <script>
    const API_URL = "https://campusgenius.onrender.com";
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      message.textContent = "Logging in...";
      button.disabled = true;

      try {
        const response = await fetch(API_URL + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || data.error || "Login failed. Check your details.");
        }

        if (!data.token || !data.student) {
          throw new Error("Login response was incomplete. Please try again.");
        }

        sessionStorage.setItem("campusgenius_token", data.token);
        sessionStorage.setItem(
          "campusgenius_student",
          JSON.stringify(data.student)
        );

        window.location.href = "dashboard.html";

      } catch (error) {
        message.textContent = error.message ||
          "Unable to connect. Please try again.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
