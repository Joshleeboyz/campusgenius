
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CampusGenius</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .auth-container {
      max-width: 460px;
      margin: 50px auto;
      padding: 28px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px #00000012;
    }
    .auth-container h1 { color: #0a7f3f; }
    .auth-container label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
    }
    .auth-container input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .auth-container button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      background: #0a7f3f;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="auth-container">
    <h1>Welcome back</h1>
    <p>Log in to your CampusGenius account.</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email"
        required autocomplete="email">

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
        required autocomplete="current-password">

      <button id="loginButton" type="submit">Log In</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p>Don't have an account?
      <a href="register.html">Create one</a>
    </p>
    <p><a href="../index.html">Back to Home</a></p>
  </main>

  <script>
    const API_URL = "https://campusgenius.onrender.com";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      message.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "Logging in...";

      try {
        const response = await fetch(API_URL + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Login failed.");
        }

        // Keep the token in this tab's session only.
        sessionStorage.setItem("campusgenius_token", data.token);
        sessionStorage.setItem(
          "campusgenius_student",
          JSON.stringify(data.student)
        );

        message.textContent =
          "Login successful! Welcome, " + data.student.full_name + ".";
        form.reset();
      } catch (error) {
        message.textContent =
          error.message === "Failed to fetch"
            ? "Could not reach the server. Please try again."
            : error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Log In";
      }
    });
  </script>
</body>
</html>
